<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GraphTech CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #F3F4F6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-xl shadow-lg border border-gray-200">
        <!-- Logo -->
        <div class="flex items-center justify-center mb-6">
            <img src="images/logo.png" alt="Logo GraphTech" class="w-12 h-12 rounded-lg mr-4">
            <span class="text-3xl font-semibold text-[#211E48]">GraphTech</span>
        </div>
        
        <h2 class="text-2xl font-bold text-center text-gray-800">Acesse sua conta</h2>

        <!-- Formulário de Login -->
        <form id="login-form" class="space-y-6" novalidate>
            <div>
                <label for="login" class="block text-sm font-medium text-gray-700 mb-1">Login</label>
                <input type="text" id="login" name="login" required
                       class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00CEF7] focus:border-[#00CEF7] sm:text-sm">
                <p id="login-error" class="text-red-500 text-xs mt-1 h-4"></p>
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="senha" name="senha" required
                       class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00CEF7] focus:border-[#00CEF7] sm:text-sm">
                <p id="senha-error" class="text-red-500 text-xs mt-1 h-4"></p>
            </div>

            <div>
                <button type="submit" id="login-button"
                        class="w-full px-5 py-3 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-[#00CEF7] hover:bg-[#00b2d3] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#00CEF7] transition duration-150 ease-in-out">
                    Entrar
                </button>
            </div>
        </form>
    </div>

    <!-- Toast de Notificação de Erro -->
    <div id="toast" class="fixed bottom-10 right-10 flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-lg shadow-lg hidden opacity-0 transition-opacity duration-300" role="alert">
        <div id="toast-icon" class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg text-red-500 bg-red-100">
             <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
        </div>
        <div id="toast-message" class="ml-3 text-sm font-normal"></div>
        <button type="button" id="toast-close" class="ml-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex h-8 w-8" aria-label="Close">
            <span class="sr-only">Fechar</span>
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const loginButton = document.getElementById('login-button');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastClose = document.getElementById('toast-close');

            // --- Função de Toast ---
            const showToast = (message) => {
                toastMessage.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('opacity-100'), 10); // Fade in
                setTimeout(() => {
                    hideToast();
                }, 4000); 
            };
            
            const hideToast = () => {
                 toast.classList.add('opacity-0');
                 setTimeout(() => toast.classList.add('hidden'), 300);
            }

            toastClose.addEventListener('click', hideToast);

            // --- Validação ---
            const setError = (id, message) => {
                const errorEl = document.getElementById(`${id}-error`);
                if (errorEl) errorEl.textContent = message;
            };

            const clearError = (id) => {
                const errorEl = document.getElementById(`${id}-error`);
                if (errorEl) errorEl.textContent = '';
            };

            // --- Submit do Login ---
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearError('login');
                clearError('senha');

                const login = document.getElementById('login').value;
                const senha = document.getElementById('senha').value;

                let isValid = true;
                if (!login) {
                    setError('login', 'O login é obrigatório.');
                    isValid = false;
                }
                if (!senha) {
                    setError('senha', 'A senha é obrigatória.');
                    isValid = false;
                }
                if (!isValid) return;

                loginButton.disabled = true;
                loginButton.textContent = "Entrando...";

                try {
                    const response = await fetch('/login', { // Endpoint de login
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ login: login, senha: senha })
                    });

                    if (response.ok) {
                        // Sucesso! Redireciona para o dashboard
                        window.location.href = '/clientes.html'; // Redireciona para a página principal
                    } else {
                        // Falha no login
                        const errorData = await response.text();
                        showToast(errorData || 'Login ou senha inválidos.');
                    }
                } catch (error) {
                    console.error('Erro ao tentar fazer login:', error);
                    showToast('Não foi possível conectar ao servidor.');
                } finally {
                    loginButton.disabled = false;
                    loginButton.textContent = "Entrar";
                }
            });
        });
    </script>
</body>
</html>
